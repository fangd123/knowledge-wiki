<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif">
  <!-- Background -->
  <rect width="1200" height="530" fill="#F5EFE3" rx="12"/>

  <!-- Header -->
  <text x="48" y="52" font-size="28" font-weight="800" fill="#2A2A2E">为什么「半途换便宜模型」反而让你破产？（缓存撕裂陷阱）</text>
  <text x="48" y="82" font-size="16" fill="#5F5A52">假设已聊了 10 万字代码背景：留在原专家读缓存打 1 折；贸然换人必须按原价从头重读 10 万字！</text>
  <line x1="48" y1="100" x2="1152" y2="100" stroke="#D9D2C5" stroke-width="2"/>

  <!-- Left Panel: Naive Router (Bad) -->
  <rect x="44" y="122" width="540" height="378" rx="8" fill="#FFFDF7" stroke="#E8684A" stroke-width="2.5"/>
  <rect x="44" y="122" width="540" height="44" rx="8" fill="#E8684A"/>
  <text x="314" y="150" font-size="18" font-weight="800" fill="#FFFDF7" text-anchor="middle">❌ 天真路由器：只看单价，每句话乱换人</text>

  <!-- Step 1 -->
  <rect x="68" y="186" width="492" height="62" rx="6" fill="#EDE6D8"/>
  <text x="86" y="212" font-size="15" font-weight="800" fill="#2A2A2E">第 1~10 轮：复杂编码 → 找「旗舰专家 A」</text>
  <text x="86" y="234" font-size="13" fill="#5F5A52">已在专家 A 桌面上铺好 10 万字热缓存（读一次仅需 1 毛钱）</text>

  <!-- Step 2 -->
  <rect x="68" y="264" width="492" height="72" rx="6" fill="#FFFDF7" stroke="#E8684A" stroke-width="2"/>
  <text x="86" y="290" font-size="15" font-weight="800" fill="#B83E25">第 11 轮：你随口说「把按钮改成蓝色」（简单活）</text>
  <text x="86" y="312" font-size="13" fill="#2A2A2E">网关贪便宜切给「半价小弟 B」→ 小弟没看过前文！</text>
  <text x="86" y="329" font-size="13" font-weight="700" fill="#B83E25">被迫全价重读 10 万字 = 花掉 5 毛钱（是留在专家那里的 5 倍！）</text>

  <!-- Step 3 -->
  <rect x="68" y="352" width="492" height="72" rx="6" fill="#FFFDF7" stroke="#E8684A" stroke-width="2"/>
  <text x="86" y="378" font-size="15" font-weight="800" fill="#B83E25">第 12 轮：又遇难题切回「旗舰专家 A」</text>
  <text x="86" y="400" font-size="13" fill="#2A2A2E">糟糕！刚离开超过 5 分钟，专家 A 的旧缓存凉透过期了！</text>
  <text x="86" y="417" font-size="13" font-weight="700" fill="#B83E25">重新建档写入 10 万字 = 暴击花掉 1 块 2 毛 5！</text>

  <rect x="68" y="440" width="492" height="42" rx="6" fill="#FFE08A"/>
  <text x="314" y="466" font-size="15" font-weight="800" fill="#B83E25" text-anchor="middle">结局：为了省几分钱挂号费，倒贴十几倍复印费 + 慢如蜗牛</text>

  <!-- Right Panel: Smart Cache-Aware Router (Good) -->
  <rect x="616" y="122" width="540" height="378" rx="8" fill="#FFFDF7" stroke="#2F9E6B" stroke-width="2.5"/>
  <rect x="616" y="122" width="540" height="44" rx="8" fill="#2F9E6B"/>
  <text x="886" y="150" font-size="18" font-weight="800" fill="#FFFDF7" text-anchor="middle">✅ 新一代聪明网关（Magpie / Plano / CCR）三把锁</text>

  <!-- Lock 1 -->
  <rect x="640" y="186" width="492" height="84" rx="6" fill="#EDE6D8" stroke="#2F9E6B" stroke-width="1.5"/>
  <text x="658" y="212" font-size="16" font-weight="800" fill="#1E7A50">第一把锁：「只升不降」单向棘轮（Magpie / LiteLLM）</text>
  <text x="658" y="235" font-size="13" fill="#2A2A2E">只要 10 万字缓存还热着，遇到简单追问也锁死原专家（仅花 1 毛）；</text>
  <text x="658" y="255" font-size="13" fill="#5F5A52">连请求顶部的「思考参数」都不乱改，防止前缀签名变化导致缓存报废。</text>

  <!-- Lock 2 -->
  <rect x="640" y="284" width="492" height="84" rx="6" fill="#EDE6D8" stroke="#3B8FD9" stroke-width="1.5"/>
  <text x="658" y="310" font-size="16" font-weight="800" fill="#1F68B0">第二把锁：先算「搬家净赚账」（Plano / CCR v2）</text>
  <text x="658" y="333" font-size="13" fill="#2A2A2E">公式：净收益 = 新模型省下的钱 － 重建旧缓存亏掉的钱。</text>
  <text x="658" y="353" font-size="13" fill="#5F5A52">算出来倒亏？立刻一票否决切换！算出来真赚 5% 以上才准搬家。</text>

  <!-- Lock 3 -->
  <rect x="640" y="382" width="492" height="100" rx="6" fill="#EDE6D8" stroke="#F2A93B" stroke-width="1.5"/>
  <text x="658" y="408" font-size="16" font-weight="800" fill="#9A5B00">第三把锁：不改合同，悄悄塞纸条（Magpie GPT-6 黑科技）</text>
  <text x="658" y="431" font-size="13" fill="#2A2A2E">想让专家少费点脑子，但改顶部设置会废掉缓存怎么办？</text>
  <text x="658" y="451" font-size="13" fill="#2A2A2E">保持顶部设置不动（100% 命中旧缓存），在最新那句话前塞一张内联纸条</text>
  <text x="658" y="470" font-size="13" font-weight="700" fill="#9A5B00">configuration_update: effort="medium" → 鱼和熊掌兼得！</text>
</svg>
